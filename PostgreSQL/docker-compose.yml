services:
  postgres_db:
    image: postgres:16
    container_name: postgres_16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dvdrental  # The database name matching your .tar file
    ports:
      - "5432:5432"    
    volumes:
      # 1. Map the .tar file into a safe temporary directory
      - ./dvdrental.tar:/tmp/dvdrental.tar
      # 2. Map our custom initialization script (created in Step 2)
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      # 3. Persistent database data
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network

  cloudbeaver:
    image: dbeaver/cloudbeaver:26.1.0
    container_name: cloudbeaver_web
    ports:
      - "8978:8978"
    volumes:
      # Persistent storage for CloudBeaver workspace (connections, settings)
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace
    depends_on:
      - postgres_db
    networks:
      - db_network

volumes:
  postgres_data:
  cloudbeaver_workspace:

networks:
  db_network:
    driver: bridge