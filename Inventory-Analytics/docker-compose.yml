version: "3.9"

# ─────────────────────────────────────────────────────────────
# Inventory Analytics – Docker Compose
# Services: PostgreSQL · Airflow (init/webserver/scheduler) · Metabase
# ─────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    INVENTORY_DB_CONN: postgresql+psycopg2://inventory:inventory@postgres:5432/inventory
    PYTHONPATH: /opt/airflow/dags
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - inventory_net

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: inventory_postgres
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_postgres.sh:/docker-entrypoint-initdb.d/00_init.sh
      - ./database/ddl:/docker-entrypoint-initdb.d/ddl
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 20s
    networks:
      - inventory_net

  # ── Airflow – init (one-shot) ──────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: inventory_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_USER}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@inventory.local \
          --password "${AIRFLOW_PASSWORD}"
        echo "Airflow ready."
    restart: on-failure

  # ── Airflow – Webserver ────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: inventory_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow – Scheduler ────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: inventory_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Metabase ───────────────────────────────────────────────
  metabase:
    image: metabase/metabase
    container_name: inventory_metabase
    env_file: .env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: "${METABASE_DB_PASSWORD}"
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: UTC
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    networks:
      - inventory_net
    volumes:
      - metabase_data:/metabase-data

volumes:
  postgres_data:
  airflow_logs:
  metabase_data:

networks:
  inventory_net:
    driver: bridge
