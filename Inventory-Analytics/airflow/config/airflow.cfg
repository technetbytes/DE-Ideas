# airflow/config/airflow.cfg
# Partial overrides – mount this at /opt/airflow/config/airflow.cfg
# Full defaults are managed by env vars in docker-compose.yml.

[core]
dags_folder           = /opt/airflow/dags
load_examples         = False
default_timezone      = UTC
executor              = LocalExecutor

[webserver]
expose_config         = False
warn_deployment_exposure = False

[scheduler]
dag_dir_list_interval = 60
min_file_process_interval = 30

[logging]
logging_level         = INFO
fab_logging_level     = WARN
