version: 2

models:
  - name: stg_customers
    description: "Staged customer data"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: "Staged order data"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: customer_orders
    description: "Customer summary with order totals"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
