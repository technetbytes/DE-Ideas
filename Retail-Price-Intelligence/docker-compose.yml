version: '3.9'

services:

  postgres:
    image: postgres:15
    container_name: retail_postgres

    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail123
      POSTGRES_DB: retail_dw

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase
    container_name: retail_metabase

    ports:
      - "3000:3000"

volumes:
  postgres_data: