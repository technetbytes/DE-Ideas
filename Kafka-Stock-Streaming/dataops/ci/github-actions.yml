name: Stock Streaming CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r producer/requirements.txt
          pip install -r consumer/requirements.txt
          pip install flake8 black mypy pytest pytest-cov

      - name: Lint with flake8
        run: |
          flake8 producer/ consumer/ --max-line-length=120 --ignore=E501,W503

      - name: Format check with black
        run: |
          black --check --line-length=120 producer/ consumer/

      - name: Type check with mypy
        run: |
          mypy producer/producer.py consumer/consumer.py --ignore-missing-imports

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Producer Image
        uses: docker/build-push-action@v5
        with:
          context: ./producer
          push: false
          tags: stock-producer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Consumer Image
        uses: docker/build-push-action@v5
        with:
          context: ./consumer
          push: false
          tags: stock-consumer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    runs-on: ubuntu-latest
    needs: build-images
    services:
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockdata
          POSTGRES_USER: stockuser
          POSTGRES_PASSWORD: stockpass123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install -r producer/requirements.txt
          pip install -r consumer/requirements.txt
          pip install pytest pytest-timeout

      - name: Initialize Database
        run: |
          PGPASSWORD=stockpass123 psql -h localhost -U stockuser -d stockdata -f scripts/init-db.sql

      - name: Run integration tests
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: stockdata
          POSTGRES_USER: stockuser
          POSTGRES_PASSWORD: stockpass123
        run: |
          pytest tests/ -v --timeout=60

  health-check:
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: |
          docker compose up -d
          sleep 30

      - name: Health check - Kafka
        run: |
          docker exec kafka kafka-broker-api-versions --bootstrap-server localhost:9092

      - name: Health check - PostgreSQL
        run: |
          docker exec postgres pg_isready -U stockuser -d stockdata

      - name: Health check - Producer metrics
        run: |
          curl -f http://localhost:8000/metrics || exit 1

      - name: Health check - Consumer metrics
        run: |
          curl -f http://localhost:8001/metrics || exit 1

      - name: Health check - Prometheus
        run: |
          curl -f http://localhost:9090/-/healthy || exit 1

      - name: Health check - Grafana
        run: |
          curl -f http://localhost:3000/api/health || exit 1

      - name: Verify data flow
        run: |
          sleep 10
          docker exec postgres psql -U stockuser -d stockdata -c "SELECT COUNT(*) FROM stock_ticks;" | grep -v "0"

      - name: Tear down
        if: always()
        run: docker compose down -v
