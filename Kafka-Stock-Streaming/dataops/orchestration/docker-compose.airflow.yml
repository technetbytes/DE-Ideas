# Airflow Overlay - add to the main docker-compose with:
#   docker compose -f docker-compose.yml -f dataops/orchestration/docker-compose.airflow.yml up -d

version: '3.8'

services:
  airflow-init:
    image: apache/airflow:2.8.0-python3.11
    container_name: airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://stockuser:stockpass123@postgres:5432/stockdata
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
        airflow connections add stockdata --conn-type postgres --conn-host postgres --conn-port 5432 --conn-schema stockdata --conn-login stockuser --conn-password stockpass123 || true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kafka-net

  airflow-webserver:
    image: apache/airflow:2.8.0-python3.11
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://stockuser:stockpass123@postgres:5432/stockdata
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    ports:
      - "8081:8080"
    volumes:
      - ./dataops/orchestration/dags:/opt/airflow/dags
      - ./dataops/data-quality:/opt/airflow/dags/dataops/data-quality
    command: airflow webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - kafka-net

  airflow-scheduler:
    image: apache/airflow:2.8.0-python3.11
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://stockuser:stockpass123@postgres:5432/stockdata
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./dataops/orchestration/dags:/opt/airflow/dags
      - ./dataops/data-quality:/opt/airflow/dags/dataops/data-quality
    command: airflow scheduler
    restart: unless-stopped
    networks:
      - kafka-net

networks:
  kafka-net:
    external: true
    name: kafka-stock-streaming_kafka-net
