global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'stock-producer'
    static_configs:
      - targets: ['stock-producer:8000']
    metrics_path: /metrics

  - job_name: 'stock-consumer'
    static_configs:
      - targets: ['stock-consumer:8001']
    metrics_path: /metrics

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
